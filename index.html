<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinSta — Financial Stability</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b6df0">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="extra.css">
<script>
/* Boot watchdog: if the app never starts, show why instead of a blank screen. */
(function(){
  var errs = []; window.__finstaErrors = errs;
  window.addEventListener("error", function(e){
    var t = e.target;
    if(t && t !== window && (t.src || t.href)) errs.push("failed to load " + (t.src || t.href).split("/").slice(-2).join("/"));
    else errs.push((e.message || "error") + (e.filename ? " @ " + e.filename.split("/").slice(-2).join("/") + ":" + e.lineno : ""));
  }, true);
  window.addEventListener("unhandledrejection", function(e){ errs.push("promise: " + ((e.reason && e.reason.message) || e.reason)); });
  setTimeout(function(){
    var root = document.getElementById("page-root");
    if(window.__finstaBooted && root && root.children.length) return;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;top:64px;left:0;right:0;bottom:0;z-index:300;background:#fff;color:#111;padding:20px;overflow:auto;font:14px/1.5 sans-serif";
    var h = document.createElement("h3"); h.textContent = "FinSta didn't start"; d.appendChild(h);
    var p = document.createElement("p"); p.textContent = "Your data is still saved on this device. Tap the button to clear the app's cached files and try again."; d.appendChild(p);
    var pre = document.createElement("pre"); pre.style.cssText = "white-space:pre-wrap;font-size:12px;background:#f3f3f3;padding:10px;border-radius:8px";
    pre.textContent = errs.length ? errs.join("\n") : "(no error was reported)"; d.appendChild(pre);
    var b = document.createElement("button"); b.textContent = "Clear app cache & reload";
    b.style.cssText = "padding:12px 16px;border:0;border-radius:8px;background:#3b6df0;color:#fff;font-size:15px";
    b.onclick = function(){
      var jobs = [];
      if(navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }));
      if(window.caches) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }));
      Promise.all(jobs).then(function(){ location.reload(); }, function(){ location.reload(); });
    };
    d.appendChild(b); document.body.appendChild(d);
  }, 4000);
})();
</script>
<script src="vendor/supabase.js"></script>
</head>
<body class="theme-simplistic-light">

  <!-- ============ AUTH OVERLAY (shown until signed in or "Continue as guest") ============ -->
  <div id="auth-overlay" class="auth-overlay hidden">
    <div class="auth-card">
      <img src="icons/icon-192.png" alt="FinSta" class="auth-logo-img">
      <h2>FinSta</h2>
      <p class="auth-tagline">Track it. Grow it. Own it.</p>

      <button class="btn" id="auth-google-signin-btn"><span class="material-icons-outlined" style="vertical-align:middle;font-size:16px">login</span> Log In with Google</button>
      <button class="btn secondary" id="auth-google-signup-btn"><span class="material-icons-outlined" style="vertical-align:middle;font-size:16px">person_add</span> Sign Up with Google</button>
      <button class="auth-guest-link" id="auth-guest-btn">Continue without an account</button>
      <div id="auth-status" class="muted"></div>
    </div>
  </div>

  <!-- ============ TOP PAGE NAV ============ -->
  <header id="page-nav" class="page-nav">
    <button class="nav-item" data-page="Home" aria-label="Home">
      <span class="material-icons-outlined nav-icon">account_balance_wallet</span>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" data-page="Income" aria-label="Income">
      <span class="material-icons-outlined nav-icon">payments</span>
      <span class="nav-label">Income</span>
    </button>
    <button class="nav-item" data-page="Expense" aria-label="Expense">
      <span class="material-icons-outlined nav-icon">receipt_long</span>
      <span class="nav-label">Expense</span>
    </button>
    <button class="nav-item" data-page="Savings" aria-label="Savings">
      <span class="material-icons-outlined nav-icon">savings</span>
      <span class="nav-label">Savings</span>
    </button>
    <button class="nav-item" data-page="Interest" aria-label="Interest">
      <span class="material-icons-outlined nav-icon">percent</span>
      <span class="nav-label">Interest</span>
    </button>
    <button class="nav-item" data-page="Loan" aria-label="Loan">
      <span class="material-icons-outlined nav-icon">account_balance</span>
      <span class="nav-label">Loan</span>
    </button>
    <button class="nav-item" data-page="Credit" aria-label="Credit">
      <span class="material-icons-outlined nav-icon">credit_card</span>
      <span class="nav-label">Credit</span>
    </button>
    <button class="nav-item" data-page="Recurring" aria-label="Recurring">
      <span class="material-icons-outlined nav-icon">event_repeat</span>
      <span class="nav-label">Recurring</span>
    </button>
  </header>

  <!-- ============ MAIN PAGE CONTENT ============ -->
  <main id="page-root" class="page-root"></main>

  <!-- ============ WIDGET DOCK TOGGLE ============ -->
  <button id="widget-dock-toggle" class="widget-dock-toggle" aria-label="Open widgets">
    <span class="material-icons-outlined">menu</span>
  </button>

  <!-- ============ WIDGET DOCK (bottom sheet) ============ -->
  <nav id="widget-dock" class="widget-dock hidden">
    <button class="dock-item" data-widget="Accounts"><span class="material-icons-outlined">badge</span><span>Accounts</span></button>
    <button class="dock-item" data-widget="Budget"><span class="material-icons-outlined">track_changes</span><span>Budget</span></button>
    <button class="dock-item" data-widget="Calculator"><span class="material-icons-outlined">calculate</span><span>Calculator</span></button>
    <button class="dock-item" data-widget="Calendar"><span class="material-icons-outlined">calendar_month</span><span>Calendar</span></button>
    <button class="dock-item" data-widget="Settings"><span class="material-icons-outlined">settings</span><span>Settings</span></button>
  </nav>

  <!-- ============ EDGE-DOCKED WIDGET ICONS ============ -->
  <div id="edge-dock-left" class="edge-dock edge-dock-left"></div>
  <div id="edge-dock-right" class="edge-dock edge-dock-right"></div>

  <!-- ============ FLOATING WIDGETS CONTAINER ============ -->
  <div id="widgets-layer" class="widgets-layer"></div>

  <!-- ============ TOAST ============ -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- ============ GENERIC MODAL (replaces browser prompt/confirm) ============ -->
  <div id="app-modal" class="app-modal hidden"></div>

  <script src="config.local.js"></script>
  <script src="app.bundle.js"></script>
</body>
</html>
